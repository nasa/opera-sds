
name: OPERA Daily Latency Query

on:
  schedule:
    # Runs around 5pm Pacific Time (UTC-7) everyday
    # Doesn't account for daylight saving transitions
    - cron: "0 17 */1 * *"
  workflow_dispatch:

jobs:
  opera-daily-products-query:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.0'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Daily Product Latency
        env:
          EDL_TOKEN: ${{ secrets.EDL_TOKEN || '' }}
          EDL_BEARER_TOKEN: ${{ secrets.EDL_BEARER_TOKEN || '' }}
        run: |
          cd monitoring
          python latency_graph.py

      - name: Save plot artifact
        uses: actions/upload-artifact@v7
        with:
          path: 'monitoring/opera_latency_query.png'
          job_alias: latest
          retention-days: 90
          archive: false

